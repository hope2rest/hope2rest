<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>은하 전투기</title>
<style>
  :root { --bg: #05070B; --ink: #C9D1D9; --dim: #5B6672; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
         font-family: Consolas, 'Courier New', monospace; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; cursor: crosshair;
           border: 1px solid #1B2230; border-radius: 10px; background: #070A12; }
  p { margin: 0; font-size: 12px; color: var(--dim); text-align: center; padding: 0 16px; }
  a { color: var(--ink); }
</style>
</head>
<body>
<canvas id="c" width="480" height="720" aria-label="은하 전투기. 방향키 또는 마우스, 손가락으로 움직이고 총은 자동으로 나갑니다"></canvas>
<p>방향키 · WASD · 마우스 · 손가락으로 이동, 총은 자동 &nbsp;|&nbsp; P 일시정지 &nbsp;|&nbsp; <a href="../">◀ 강아지 달리기</a> &nbsp;|&nbsp; <a href="https://github.com/hope2rest">github.com/hope2rest</a></p>
<script>
const W = 480, H = 720, PX = 3;
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;

function fit() {
  const s = Math.min((innerWidth - 24) / W, (innerHeight - 60) / H);
  cv.style.width = `${Math.floor(W * s)}px`;
  cv.style.height = `${Math.floor(H * s)}px`;
}
addEventListener('resize', fit); fit();

/* ── 도트 그림 (위를 보는 방향). 글자 = 색 ─────────────────────── */
const PAL = {
  W: '#D8DEE6', w: '#9AA5B1', R: '#E5484D', C: '#7D8794', E: '#FFB347', B: '#6EC1FF',
  D: '#4A5361', d: '#2B313B', G: '#5CF08B', g: '#2E8F52', K: '#14181F', Y: '#FFE07A', O: '#FF8A3D',
};
const SPR = {
  // 날개 끝에 포가 달린 X 자 날개 전투기(자체 디자인)
  player: [
    '.......W.......',
    '.......W.......',
    '......WBW......',
    '......WBW......',
    '.C....WWW....C.',
    '.C....WRW....C.',
    '.C....WRW....C.',
    '.C...wWWWw...C.',
    '.WWWWWWWWWWWWW.',
    '.WRRWWWWWWWRRW.',
    '..wWWWWWWWWWw..',
    '......WWW......',
    '.....wWWWw.....',
    '.....E...E.....',
  ],
  // 육각 날개 적기(아래를 봄)
  fighter: [
    'dd.......dd',
    'dDd.....dDd',
    'dDDd...dDDd',
    'dDDdDDDdDDd',
    'dDDDGGGDDDd',
    'dDDdGKGdDDd',
    'dDDd.G.dDDd',
    'dDd.....dDd',
    'dd.......dd',
  ],
  // 화살촉 요격기(아래를 봄)
  interceptor: [
    'D.........D',
    'DD.......DD',
    '.DD.DDD.DD.',
    '..DDDGDDD..',
    '...DGKGD...',
    '....DGD....',
    '.....D.....',
  ],
  power: [
    '.YYYYY.',
    'YOOOOOY',
    'YO.Y.OY',
    'YOYYYOY',
    'YO.Y.OY',
    'YOOOOOY',
    '.YYYYY.',
  ],
};
// 둥근 요새(보스): 원을 도트로 깎아 만든다
SPR.boss = (() => {
  const n = 31, r = 15, rows = [];
  for (let y = 0; y < n; y++) {
    let row = '';
    for (let x = 0; x < n; x++) {
      const dx = x - r, dy = y - r, d = Math.hypot(dx, dy);
      if (d > r + 0.3) row += '.';
      else if (d > r - 1.2) row += 'd';
      else if (Math.abs(dy) <= 1 && d < r - 1) row += 'K';                 // 가운데 띠
      else if (Math.hypot(dx - 6, dy + 6) < 4) row += (Math.hypot(dx - 6, dy + 6) < 2 ? 'G' : 'g'); // 빛나는 포구
      else row += (x + y) % 7 === 0 ? 'w' : 'D';
    }
    rows.push(row);
  }
  return rows;
})();

function bake(grid) {
  const c = document.createElement('canvas');
  c.width = grid[0].length * PX; c.height = grid.length * PX;
  const x = c.getContext('2d');
  grid.forEach((row, r) => [...row].forEach((ch, k) => { if (PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(k * PX, r * PX, PX, PX); } }));
  return c;
}
const IMG = Object.fromEntries(Object.entries(SPR).map(([k, v]) => [k, bake(v)]));
const put = (img, x, y) => g.drawImage(img, Math.round(x - img.width / 2), Math.round(y - img.height / 2));

/* ── 상태 ─────────────────────────────────────────────────────── */
let hi = 0;
try { hi = Number(localStorage.getItem('space-hi')) || 0; } catch {}
const keys = new Set();
let ptr = null, paused = false, S;

const stars = [0, 1, 2].flatMap((layer) => Array.from({ length: 40 }, () => ({
  x: Math.random() * W, y: Math.random() * H, layer, s: [0.6, 1.4, 2.6][layer],
})));

function reset(mode = 'play') {
  S = {
    mode, t: 0, score: 0, level: 1, lives: 3, inv: 90, power: 1, cool: 0,
    p: { x: W / 2, y: H - 110 }, pb: [], eb: [], foes: [], fx: [], items: [],
    spawn: 60, boss: null, nextBoss: 3000, banner: 120,
  };
}
reset('start');

/* ── 입력 ─────────────────────────────────────────────────────── */
addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  if (e.code === 'KeyP' && S.mode === 'play') paused = !paused;
  if ((e.code === 'Space' || e.code === 'Enter') && S.mode !== 'play') reset();
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); if (S.mode === 'play') paused = true; });
const toLocal = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
cv.addEventListener('pointerdown', (e) => {
  if (S.mode !== 'play') { reset(); return; }
  paused = false;
  ptr = { ...toLocal(e), touch: e.pointerType !== 'mouse' };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse' && S.mode === 'play') ptr = { ...toLocal(e), touch: false };
  else if (ptr) ptr = { ...toLocal(e), touch: true };
});
cv.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') ptr = null; });
cv.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') ptr = null; });

/* ── 만들기 ───────────────────────────────────────────────────── */
function boom(x, y, n = 14, big = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (1 + Math.random() * 3) * big;
    S.fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 22 + Math.random() * 18, c: ['#FFE07A', '#FF8A3D', '#E5484D', '#FFFFFF'][i % 4], s: Math.random() < 0.3 ? 4 : 3 });
  }
}
function foe(type, x, y, extra = {}) {
  const base = type === 'fighter' ? { hp: 1, val: 100, r: 15 } : { hp: 3, val: 250, r: 14 };
  S.foes.push({ type, x, y, vx: 0, vy: 2, t: 0, fire: 60 + Math.random() * 120, ...base, ...extra });
}
function wave() {
  const lv = S.level, k = Math.floor(Math.random() * 4);
  if (k === 0) for (let i = 0; i < 5; i++) foe('fighter', 60 + i * 90, -30 - i * 4, { vy: 1.8 + lv * 0.2 });
  if (k === 1) for (let i = 0; i < 5; i++) foe('fighter', W / 2 + (i - 2) * 56, -30 - Math.abs(i - 2) * 40, { vy: 2 + lv * 0.2 });
  if (k === 2) { const left = Math.random() < 0.5; for (let i = 0; i < 4; i++) foe('interceptor', left ? 90 : W - 90, -30 - i * 60, { zig: left ? 1 : -1, vy: 2.6 + lv * 0.2 }); }
  if (k === 3) for (let i = 0; i < 6; i++) foe('fighter', 40 + Math.random() * (W - 80), -30 - i * 50, { vy: 2.2 + Math.random() + lv * 0.2 });
}
function aim(from, speed, spread = 0) {
  const a = Math.atan2(S.p.y - from.y, S.p.x - from.x) + spread;
  S.eb.push({ x: from.x, y: from.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed });
}
function shoot() {
  const { x, y } = S.p, b = (dx, dy, vx = 0) => S.pb.push({ x: x + dx, y: y + dy, vx, vy: -11 });
  b(-18, -2); b(18, -2);                         // 날개 끝 두 줄기
  if (S.power >= 2) b(0, -20);
  if (S.power >= 3) { b(-10, -8, -1.6); b(10, -8, 1.6); }
}
function hurt() {
  if (S.inv > 0) return;
  S.lives--; S.inv = 120; S.power = Math.max(1, S.power - 1);
  boom(S.p.x, S.p.y, 30, 1.4);
  if (S.lives < 0) {
    S.mode = 'over';
    if (S.score > hi) { hi = S.score; try { localStorage.setItem('space-hi', String(hi)); } catch {} }
  }
}
const near = (a, b, r) => Math.abs(a.x - b.x) < r && Math.abs(a.y - b.y) < r;

/* ── 한 프레임 ────────────────────────────────────────────────── */
function step() {
  for (const s of stars) { s.y += s.s * (S.boss ? 0.6 : 1); if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
  if (S.mode === 'play' && !paused) update();
  for (const f of S.fx) { f.x += f.vx; f.y += f.vy; f.vx *= 0.94; f.vy *= 0.94; f.life--; }
  S.fx = S.fx.filter((f) => f.life > 0);
  render();
  requestAnimationFrame(step);
}

function update() {
  S.t++; if (S.inv > 0) S.inv--; if (S.banner > 0) S.banner--;
  const p = S.p, sp = 5.2;
  let dx = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
  let dy = (keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0) - (keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0);
  if (dx || dy) { const n = Math.hypot(dx, dy); p.x += dx / n * sp; p.y += dy / n * sp; }
  else if (ptr) {
    // 손가락은 기체를 가리지 않게 기체를 손가락 조금 위에 둔다
    const tx = ptr.x, ty = ptr.y - (ptr.touch ? 70 : 0);
    const mx = tx - p.x, my = ty - p.y, d = Math.hypot(mx, my);
    if (d > 1) { const v = Math.min(d, 9); p.x += mx / d * v; p.y += my / d * v; }
  }
  p.x = Math.max(24, Math.min(W - 24, p.x)); p.y = Math.max(60, Math.min(H - 30, p.y));

  if (--S.cool <= 0) { shoot(); S.cool = 7; }
  for (const b of S.pb) { b.x += b.vx; b.y += b.vy; }
  S.pb = S.pb.filter((b) => b.y > -20 && b.x > -20 && b.x < W + 20);

  // 적 등장 · 보스
  if (!S.boss && S.score >= S.nextBoss) {
    S.boss = { x: W / 2, y: -60, hp: 160 + S.level * 60, max: 160 + S.level * 60, t: 0, r: 44 };
    S.banner = 0;
  }
  if (!S.boss && --S.spawn <= 0) { wave(); S.spawn = Math.max(55, 120 - S.level * 12 - S.t / 300); }

  for (const f of S.foes) {
    f.t++;
    if (f.type === 'interceptor') f.x += Math.sin(f.t / 16) * 3.2 * f.zig;
    f.x += f.vx; f.y += f.vy;
    if (--f.fire <= 0 && f.y > 20 && f.y < H * 0.7) { aim(f, 3.4 + S.level * 0.3); f.fire = 110 + Math.random() * 120 - S.level * 10; }
    if (near(f, p, f.r)) { f.hp = 0; boom(f.x, f.y); hurt(); }
  }

  const B = S.boss;
  if (B) {
    B.t++;
    B.y += (150 - B.y) * 0.02;
    B.x = W / 2 + Math.sin(B.t / 90) * 140;
    if (B.t > 90) {
      if (B.t % 70 === 0) for (let i = -2; i <= 2; i++) aim({ x: B.x + 6 * PX, y: B.y - 6 * PX + 20 }, 3.6, i * 0.16);
      if (B.t % 150 === 0) for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2 + B.t; S.eb.push({ x: B.x, y: B.y, vx: Math.cos(a) * 2.6, vy: Math.sin(a) * 2.6 }); }
    }
    if (near(B, p, 46)) hurt();
  }

  // 맞히기
  for (const b of S.pb) {
    for (const f of S.foes) if (f.hp > 0 && near(b, f, f.r)) { f.hp--; b.hit = true; if (f.hp <= 0) { boom(f.x, f.y); S.score += f.val; if (Math.random() < 0.09) S.items.push({ x: f.x, y: f.y }); } break; }
    if (!b.hit && B && Math.hypot(b.x - B.x, b.y - B.y) < B.r) {
      b.hit = true; B.hp--;
      if (Math.random() < 0.3) S.fx.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 6, c: '#FFFFFF', s: 4 });
      if (B.hp <= 0) {
        for (let i = 0; i < 6; i++) setTimeout(() => boom(B.x + (Math.random() - 0.5) * 70, B.y + (Math.random() - 0.5) * 70, 26, 1.8), i * 120);
        S.score += 3000; S.level++; S.boss = null; S.nextBoss = S.score + 6000; S.eb = []; S.banner = 120;
        S.items.push({ x: B.x, y: B.y });
      }
    }
  }
  S.pb = S.pb.filter((b) => !b.hit);
  S.foes = S.foes.filter((f) => f.hp > 0 && f.y < H + 40);

  for (const e of S.eb) { e.x += e.vx; e.y += e.vy; if (Math.abs(e.x - p.x) < 6 && Math.abs(e.y - p.y) < 8) { e.gone = true; hurt(); } }
  S.eb = S.eb.filter((e) => !e.gone && e.y < H + 10 && e.y > -10 && e.x > -10 && e.x < W + 10);

  for (const it of S.items) {
    it.y += 1.6;
    if (near(it, p, 22)) { it.gone = true; if (S.power < 3) S.power++; else S.score += 500; S.fx.push({ x: it.x, y: it.y - 10, vx: 0, vy: -1, life: 40, c: '#FFE07A', s: 0, text: S.power < 3 ? 'POWER UP' : '+500' }); }
  }
  S.items = S.items.filter((it) => !it.gone && it.y < H + 20);
}

/* ── 그리기 ───────────────────────────────────────────────────── */
function render() {
  g.fillStyle = '#070A12'; g.fillRect(0, 0, W, H);
  for (const s of stars) { g.fillStyle = ['#2A3344', '#56637A', '#C9D6EA'][s.layer]; g.fillRect(Math.round(s.x), Math.round(s.y), s.layer === 2 ? 2 : 1, s.layer === 2 ? 3 : 1); }

  for (const it of S.items) put(IMG.power, it.x, it.y);
  for (const f of S.foes) put(IMG[f.type], f.x, f.y);
  const B = S.boss;
  if (B) {
    put(IMG.boss, B.x, B.y);
    g.fillStyle = '#1B2230'; g.fillRect(90, 40, W - 180, 6);
    g.fillStyle = '#5CF08B'; g.fillRect(90, 40, (W - 180) * B.hp / B.max, 6);
  }
  // 레이저: 바깥 번짐 + 안쪽 심
  for (const b of S.pb) { g.fillStyle = 'rgba(229,72,77,.35)'; g.fillRect(b.x - 2, b.y - 8, 5, 16); g.fillStyle = '#FF6B6F'; g.fillRect(b.x - 1, b.y - 7, 2, 14); }
  for (const e of S.eb) { g.fillStyle = 'rgba(92,240,139,.3)'; g.fillRect(e.x - 3, e.y - 3, 7, 7); g.fillStyle = '#B9FFD0'; g.fillRect(e.x - 1, e.y - 1, 3, 3); }

  if (S.mode !== 'start' && (S.mode === 'play' || S.mode === 'over') && S.lives >= 0 && !(S.inv > 0 && Math.floor(S.inv / 5) % 2)) {
    put(IMG.player, S.p.x, S.p.y);
    if (S.mode === 'play') { g.fillStyle = Math.random() < 0.5 ? '#FFB347' : '#FF8A3D'; g.fillRect(S.p.x - 8, S.p.y + 21, 3, 4 + Math.random() * 4); g.fillRect(S.p.x + 6, S.p.y + 21, 3, 4 + Math.random() * 4); }
  }
  for (const f of S.fx) {
    if (f.text) { g.fillStyle = f.c; g.font = 'bold 13px Consolas, monospace'; g.textAlign = 'center'; g.fillText(f.text, f.x, f.y); continue; }
    g.fillStyle = f.c; g.fillRect(Math.round(f.x), Math.round(f.y), f.s, f.s);
  }

  // 머리 정보
  g.textAlign = 'left'; g.font = '14px Consolas, monospace';
  g.fillStyle = '#C9D1D9'; g.fillText(String(S.score).padStart(7, '0'), 14, 24);
  g.fillStyle = '#5B6672'; g.fillText(`HI ${String(Math.max(hi, S.score)).padStart(7, '0')}`, 140, 24);
  g.textAlign = 'right'; g.fillStyle = '#C9D1D9';
  const life = S.lives > 5 ? `♥×${S.lives}` : '♥'.repeat(Math.max(0, S.lives));
  g.fillText(`${life}  LV${S.level}  P${S.power}`, W - 14, 24);

  g.textAlign = 'center';
  if (S.mode === 'play' && S.banner > 0) { g.fillStyle = `rgba(201,209,217,${Math.min(1, S.banner / 40)})`; g.font = 'bold 18px Consolas, monospace'; g.fillText(`STAGE ${S.level}`, W / 2, H / 2 - 40); }
  if (S.mode === 'play' && B && B.t < 90) { g.fillStyle = '#E5484D'; g.font = 'bold 18px Consolas, monospace'; if (Math.floor(B.t / 10) % 2) g.fillText('WARNING · 요새 접근', W / 2, H / 2 - 40); }
  if (paused) overlay('일시정지', '누르거나 P 를 누르면 계속');
  if (S.mode === 'start') {
    put(IMG.player, W / 2, H / 2 + 70);
    overlay('은하 전투기', '눌러서 시작 · 스페이스 · 엔터');
  }
  if (S.mode === 'over') overlay('G A M E   O V E R', `점수 ${S.score.toLocaleString()} · 눌러서 다시`);
}
function overlay(title, sub) {
  g.fillStyle = 'rgba(5,7,11,.55)'; g.fillRect(0, H / 2 - 90, W, 120);
  g.fillStyle = '#F4F6F8'; g.font = 'bold 26px Consolas, "Malgun Gothic", monospace'; g.fillText(title, W / 2, H / 2 - 30);
  g.fillStyle = '#8A96A3'; g.font = '14px Consolas, "Malgun Gothic", monospace'; g.fillText(sub, W / 2, H / 2 + 2);
}

requestAnimationFrame(step);
</script>
</body>
</html>
